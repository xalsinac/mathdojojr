<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    let initialTheme = new URLSearchParams(location.hash.slice(1)).get('mathjr-theme');
    if (!initialTheme) {
      const savedCookie = document.cookie.match(/(?:^|; )mathjr_theme=(light|dark)(?:;|$)/);
      if (savedCookie) initialTheme = savedCookie[1];
    }
    try { initialTheme = initialTheme || localStorage.getItem('mathjr_theme'); } catch (_) {}
    if (initialTheme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rayo Mental | Math Dojo Junior ⚡</title>
  <meta name="theme-color" content="#101116">

  <link rel="stylesheet" href="ui.css">
  <script src="dojo-audio.js" defer></script>
  <script src="dojo-fx.js" defer></script>
  <script src="dojo-progress.js" defer></script>
  <script src="accessibility.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="practice-guide.js" defer></script>

  <style>
    .game-area {
      display: none;
      width: min(96%, 640px);
      flex-direction: column;
      align-items: center;
    }
    .game-area.active { display: flex; }

    .game-layout {
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 28px;
      padding: 1.6rem 1.2rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    .problem-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .equation {
      font-size: clamp(2.8rem, 8.5vw, 4rem);
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 0.8rem;
      letter-spacing: 0.04em;
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .answer-display {
      width: clamp(160px, 45vw, 210px);
      height: clamp(70px, 16vw, 84px);
      font-size: clamp(2.6rem, 7vw, 3.4rem);
      font-weight: 800;
      text-align: center;
      border-radius: 20px;
      border: 2.5px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.6rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .answer-display.focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
      background: var(--bg-card);
    }

    .feedback {
      min-height: 2.2rem;
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .feedback.correct { color: #10b981; animation: bounce 0.4s; }
    .feedback.wrong { color: #f43f5e; animation: shake 0.35s; }

    @media (min-width: 680px) {
      .game-layout {
        flex-direction: row;
        justify-content: space-around;
        padding: 2.2rem 1.6rem;
      }
      .problem-section {
        flex: 1.2;
        border-right: 2px dashed var(--border-color);
        padding-right: 1.6rem;
      }
      .keypad {
        flex: 0.9;
        max-width: 290px;
      }
    }
  </style>
</head>
<body>
  <!-- Barra de Navegación -->
  <div class="top-nav">
    <a href="index.html" class="btn-nav">⬅️ Inicio</a>
    <div class="top-nav-group">
      <button class="sound-toggle-btn" type="button" onclick="DojoAudio.toggleMute()" aria-label="Silenciar o activar sonido" title="Sonido">
        <span class="sound-icon">🔊</span>
      </button>
      <button class="theme-toggle-btn" type="button" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema de color">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </div>

  <div class="header">
    <h1 style="color: #f59e0b;">⚡ Rayo Mental</h1>
    <p>Elige tu cinturón, entrena la mente y completa tu ronda</p>
  </div>

  <!-- SELECTOR DE CINTURONES -->
  <div class="level-selector" id="level-selector">
    <button class="belt-btn" data-level="blanco-sumas">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Blanco (Sumas)</span>
        <span class="belt-desc">Sumas rápidas de reflejos hasta 12</span>
      </div>
      <div class="belt-badge-stars" data-belt="blanco-sumas">🥋</div>
    </button>
    <button class="belt-btn" data-level="blanco-restas">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Blanco (Restas)</span>
        <span class="belt-desc">Restas con números hasta 12</span>
      </div>
      <div class="belt-badge-stars" data-belt="blanco-restas">🥋</div>
    </button>
    <button class="belt-btn" data-level="naranja">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Naranja</span>
        <span class="belt-desc">Sumas hasta 60 y restas hasta 40</span>
      </div>
      <div class="belt-badge-stars" data-belt="naranja">🥋</div>
    </button>
    <button class="belt-btn" data-level="azul">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Azul</span>
        <span class="belt-desc">Cuatro operaciones y tablas del 2 al 10</span>
      </div>
      <div class="belt-badge-stars" data-belt="azul">🥋</div>
    </button>
    <button class="belt-btn" data-level="negro">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
          <rect x="18" y="37" width="6" height="2" fill="#fbbf24"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Negro</span>
        <span class="belt-desc">Cuatro operaciones y tablas del 3 al 12</span>
      </div>
      <div class="belt-badge-stars" data-belt="negro">🥋</div>
    </button>
  </div>

  <!-- ÁREA DEL JUEGO -->
  <div class="game-area" id="game-area">
    <div class="game-header">
      <button class="change-level-btn" onclick="showLevelSelector()">🥋 Niveles</button>
      <span class="active-level" id="header-belt-name">🥋 Cinturón Blanco</span>
      <div class="score-board">
        <span>✅ <b id="score">0</b></span>
        <span>🔥 <b id="streak">0</b></span>
      </div>
    </div>

    <!-- Indicador de Ronda de 8 preguntas -->
    <div class="round-progress-container" id="round-progress-indicator"></div>

    <div class="game-layout">
      <!-- Problema -->
      <div class="problem-section">
        <div class="equation" id="equation">2 + 2 =</div>
        <div class="answer-display focus" id="answer"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      </div>

      <!-- Teclado Virtual -->
      <div class="keypad">
        <button class="key-btn" onclick="pressKey(1)">1</button>
        <button class="key-btn" onclick="pressKey(2)">2</button>
        <button class="key-btn" onclick="pressKey(3)">3</button>
        <button class="key-btn" onclick="pressKey(4)">4</button>
        <button class="key-btn" onclick="pressKey(5)">5</button>
        <button class="key-btn" onclick="pressKey(6)">6</button>
        <button class="key-btn" onclick="pressKey(7)">7</button>
        <button class="key-btn" onclick="pressKey(8)">8</button>
        <button class="key-btn" onclick="pressKey(9)">9</button>
        <button class="key-btn key-action" onclick="clearAnswer()">Borrar</button>
        <button class="key-btn" onclick="pressKey(0)">0</button>
        <button class="key-btn key-ok" onclick="checkAnswer()">OK</button>
      </div>
    </div>
  </div>

  <script>
    let currentLevel = '';
    let currentAnswer = 0;
    let userAnswerString = '';
    let score = 0;
    let streak = 0;
    let isWaiting = false;
    let roundManager = null;

    const levelSelector = document.getElementById('level-selector');
    const gameArea = document.getElementById('game-area');
    const equationEl = document.getElementById('equation');
    const answerDisplay = document.getElementById('answer');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score');
    const streakEl = document.getElementById('streak');
    const beltBtns = document.querySelectorAll('.belt-btn');
    const headerTexts = document.querySelector('.header');
    const headerBeltName = document.getElementById('header-belt-name');

    const beltNames = {
      'blanco-sumas': 'Blanco (Sumas)',
      'blanco-restas': 'Blanco (Restas)',
      'naranja': 'Cinturón Naranja',
      'azul': 'Cinturón Azul',
      'negro': 'Cinturón Negro'
    };

    function showLevelSelector() {
      gameArea.classList.remove('active');
      levelSelector.style.display = 'flex';
      headerTexts.style.display = 'block';
      refreshBeltStars();
    }

    function refreshBeltStars() {
      if (!window.DojoProgress) return;
      ['blanco-sumas', 'blanco-restas', 'naranja', 'azul', 'negro'].forEach(bId => {
        const data = DojoProgress.getGameBelt('mental', bId);
        const el = document.querySelector(`.belt-badge-stars[data-belt="${bId}"]`);
        if (el) {
          el.textContent = data.stars > 0 ? `🥋 ${'⭐'.repeat(data.stars)}` : '🥋';
        }
      });
    }

    beltBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentLevel = btn.dataset.level;
        headerBeltName.textContent = `🥋 ${beltNames[currentLevel] || currentLevel}`;
        levelSelector.style.display = 'none';
        headerTexts.style.display = 'none';
        gameArea.classList.add('active');

        score = 0; streak = 0;
        updateScore();
        feedbackEl.textContent = '';

        if (window.DojoRoundManager) {
          roundManager = new DojoRoundManager({
            gameId: 'mental',
            beltId: currentLevel,
            beltName: beltNames[currentLevel],
            totalQuestions: 8,
            onRestart: () => startNewRound()
          });
          roundManager.start();
        }

        generateProblem();
      });
    });

    function startNewRound() {
      score = 0; streak = 0;
      updateScore();
      if (roundManager) roundManager.start();
      generateProblem();
    }

    function pressKey(num) {
      if (isWaiting) return;
      if (window.DojoAudio) DojoAudio.play('tap');
      if (userAnswerString.length < 4) {
        userAnswerString += num;
        updateDisplay();
      }
    }

    function clearAnswer() {
      if (isWaiting) return;
      if (window.DojoAudio) DojoAudio.play('tap');
      userAnswerString = '';
      updateDisplay();
    }

    function updateDisplay() {
      answerDisplay.textContent = userAnswerString;
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateProblem() {
      let a, b, op;
      userAnswerString = '';
      updateDisplay();
      isWaiting = false;

      if (currentLevel === 'blanco-sumas') {
        op = '+';
        a = randomInt(1, 10);
        b = randomInt(1, 12 - a);
        currentAnswer = a + b;
      }
      else if (currentLevel === 'blanco-restas') {
        op = '-';
        a = randomInt(2, 12);
        b = randomInt(1, a);
        currentAnswer = a - b;
      }
      else if (currentLevel === 'naranja') {
        op = Math.random() > 0.5 ? '+' : '-';
        if (op === '+') {
          a = randomInt(5, 30); b = randomInt(5, 30);
          currentAnswer = a + b;
        } else {
          a = randomInt(10, 40); b = randomInt(1, a);
          currentAnswer = a - b;
        }
      }
      else if (currentLevel === 'azul') {
        const ops = ['+', '-', 'x', '÷'];
        op = ops[randomInt(0, 3)];
        if (op === '+') { a = randomInt(10, 50); b = randomInt(10, 50); currentAnswer = a + b; }
        else if (op === '-') { a = randomInt(20, 60); b = randomInt(5, a); currentAnswer = a - b; }
        else if (op === 'x') { a = randomInt(2, 10); b = randomInt(2, 10); currentAnswer = a * b; }
        else if (op === '÷') {
          b = randomInt(2, 10); currentAnswer = randomInt(2, 10);
          a = b * currentAnswer;
        }
      }
      else if (currentLevel === 'negro') {
        const ops = ['+', '-', 'x', '÷'];
        op = ops[randomInt(0, 3)];
        if (op === '+') { a = randomInt(20, 100); b = randomInt(20, 100); currentAnswer = a + b; }
        else if (op === '-') { a = randomInt(30, 120); b = randomInt(10, a); currentAnswer = a - b; }
        else if (op === 'x') { a = randomInt(3, 12); b = randomInt(3, 12); currentAnswer = a * b; }
        else if (op === '÷') {
          b = randomInt(3, 12); currentAnswer = randomInt(3, 15);
          a = b * currentAnswer;
        }
      }

      equationEl.textContent = `${a} ${op} ${b} =`;
    }

    function checkAnswer() {
      if (userAnswerString === '' || isWaiting) return;
      isWaiting = true;

      const userAnswer = parseInt(userAnswerString, 10);
      const isCorrect = (userAnswer === currentAnswer);

      if (isCorrect) {
        score++; streak++;
        feedbackEl.textContent = '¡Rayo certero! ✨⚡';
        feedbackEl.className = 'feedback correct';
        updateScore();

        if (window.DojoAudio) DojoAudio.play('correct');
        if (window.DojoFX) DojoFX.sparkle(answerDisplay);

        const finished = roundManager ? roundManager.recordAnswer(true) : false;

        if (!finished) {
          setTimeout(() => {
            feedbackEl.textContent = '';
            generateProblem();
          }, 900);
        }
      } else {
        streak = 0;
        feedbackEl.textContent = `¡Casi! Era ${currentAnswer}`;
        feedbackEl.className = 'feedback wrong';
        updateScore();

        if (window.DojoAudio) DojoAudio.play('wrong');

        setTimeout(() => {
          feedbackEl.textContent = '';
          userAnswerString = '';
          updateDisplay();
          isWaiting = false;
        }, 1400);
      }
    }

    function updateScore() {
      scoreEl.textContent = score;
      streakEl.textContent = streak;
    }

    // Soporte teclado físico
    document.addEventListener('keydown', (e) => {
      if (!gameArea.classList.contains('active') || isWaiting) return;

      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        userAnswerString = userAnswerString.slice(0, -1);
        updateDisplay();
      } else if (e.key === 'Enter') {
        checkAnswer();
      } else if (e.key === 'Escape') {
        clearAnswer();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      refreshBeltStars();
    });
  </script>
</body>
</html>
