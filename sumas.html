<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    let initialTheme = new URLSearchParams(location.hash.slice(1)).get('mathjr-theme');
    if (!initialTheme) {
      const savedCookie = document.cookie.match(/(?:^|; )mathjr_theme=(light|dark)(?:;|$)/);
      if (savedCookie) initialTheme = savedCookie[1];
    }
    try { initialTheme = initialTheme || localStorage.getItem('mathjr_theme'); } catch (_) {}
    if (initialTheme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Súper Sumas | Math Dojo Junior 🦸‍♂️</title>
  <meta name="theme-color" content="#101116">
  
  <link rel="stylesheet" href="ui.css">
  <script src="dojo-audio.js" defer></script>
  <script src="dojo-fx.js" defer></script>
  <script src="dojo-progress.js" defer></script>
  <script src="accessibility.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="practice-guide.js" defer></script>
  <script src="practice-help.js" defer></script>

  <style>
    /* Estilos específicos de Súper Sumas */
    .game-area {
      display: none;
      width: min(96%, 680px);
      flex-direction: column;
      align-items: center;
    }
    .game-area.active { display: flex; }

    .game-layout {
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 28px;
      padding: 1.4rem 1rem 1.6rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      align-items: center;
    }

    .problem-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow-x: auto;
      padding: 0.5rem 0;
    }

    .sum-wrapper {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      padding-left: 2.5rem;
      position: relative;
    }

    .sum-row {
      display: flex;
      gap: 0.35rem;
      position: relative;
      margin-bottom: 0.35rem;
    }

    .last-operand {
      border-bottom: 4px solid var(--text-main);
      padding-bottom: 0.7rem;
      margin-bottom: 0.8rem;
    }

    .sign {
      position: absolute;
      left: -2.4rem;
      bottom: 0.7rem;
      font-size: 2.6rem;
      font-weight: 800;
      color: #10b981;
      line-height: 1;
    }

    .box {
      width: clamp(2.8rem, 8vw, 3.4rem);
      height: clamp(3.2rem, 9vw, 3.8rem);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(2rem, 6vw, 2.5rem);
      font-weight: 800;
      border-radius: 12px;
      transition: background-color 0.15s;
    }

    .empty { background: transparent; }
    .digit { color: var(--text-main); }

    .box.col-highlight {
      background-color: rgba(56, 189, 248, 0.18);
    }
    [data-theme="light"] .box.col-highlight {
      background-color: rgba(59, 130, 246, 0.16);
    }

    .sum-input {
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      text-align: center;
      cursor: pointer;
      outline: none;
      caret-color: transparent;
      font-size: clamp(2rem, 6vw, 2.5rem);
      font-weight: 800;
      transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
    }

    .sum-input.focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
      background: var(--bg-card);
    }

    .carry-input {
      width: clamp(2rem, 6vw, 2.5rem);
      height: clamp(2rem, 6vw, 2.5rem);
      font-size: 1.35rem;
      margin: 0 0.35rem;
      border-color: rgba(245, 158, 11, 0.5);
      color: var(--accent-gold);
      border-radius: 10px;
    }

    .feedback {
      min-height: 2.2rem;
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: 0.6rem;
      width: 100%;
    }
    .feedback.correct { color: #10b981; animation: bounce 0.4s; }
    .feedback.wrong { color: #f43f5e; animation: shake 0.35s; }

    @media (min-width: 680px) {
      .game-layout {
        flex-direction: row;
        justify-content: space-around;
        padding: 2rem 1.5rem;
      }
      .problem-section {
        flex: 1.2;
        border-right: 2px dashed var(--border-color);
        padding-right: 1.5rem;
      }
      .keypad {
        flex: 0.9;
        max-width: 290px;
      }
    }
  </style>
</head>
<body>
  <!-- Barra de Navegación -->
  <div class="top-nav">
    <a href="index.html" class="btn-nav">⬅️ Inicio</a>
    <div class="top-nav-group">
      <button class="sound-toggle-btn" type="button" onclick="DojoAudio.toggleMute()" aria-label="Silenciar o activar sonido" title="Sonido">
        <span class="sound-icon">🔊</span>
      </button>
      <button class="theme-toggle-btn" type="button" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema de color">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </div>

  <div class="header">
    <h1 style="color: #10b981;">🦸‍♂️ Súper Sumas</h1>
    <p>Alinea por columnas, calcula las llevadas y supera tu ronda</p>
  </div>

  <!-- SELECTOR DE CINTURONES -->
  <div class="level-selector" id="level-selector">
    <button class="belt-btn" data-level="blanco">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Blanco</span>
        <span class="belt-desc">2 cifras sin llevar (calentamiento)</span>
      </div>
      <div class="belt-badge-stars" data-belt="blanco">🥋</div>
    </button>
    <button class="belt-btn" data-level="naranja">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Naranja</span>
        <span class="belt-desc">3 cifras con llevadas en columnas</span>
      </div>
      <div class="belt-badge-stars" data-belt="naranja">🥋</div>
    </button>
    <button class="belt-btn" data-level="azul">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Azul</span>
        <span class="belt-desc">Grandes sumas de 5 cifras</span>
      </div>
      <div class="belt-badge-stars" data-belt="azul">🥋</div>
    </button>
    <button class="belt-btn" data-level="negro">
      <div class="belt-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="10" width="36" height="10" rx="3" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
          <rect x="6" y="24" width="36" height="10" rx="3" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
          <circle cx="24" cy="22" r="7" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
          <path d="M21 28 L17 42 L25 40 Z" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
          <path d="M27 28 L31 42 L23 40 Z" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
          <rect x="18" y="37" width="6" height="2" fill="#fbbf24"/>
        </svg>
      </div>
      <div class="belt-text">
        <span class="belt-title">Cinturón Negro</span>
        <span class="belt-desc">Cuatro sumandos de 5 cifras (Maestro del Dojo)</span>
      </div>
      <div class="belt-badge-stars" data-belt="negro">🥋</div>
    </button>
  </div>

  <!-- ÁREA DEL JUEGO -->
  <div class="game-area" id="game-area">
    <div class="game-header">
      <button class="change-level-btn" onclick="showLevelSelector()">🥋 Niveles</button>
      <span class="active-level" id="header-belt-name">🥋 Cinturón Blanco</span>
      <div class="score-board">
        <span>✅ <b id="score">0</b></span>
        <span>🔥 <b id="streak">0</b></span>
      </div>
    </div>

    <!-- Indicador de Ronda de 8 preguntas -->
    <div class="round-progress-container" id="round-progress-indicator"></div>

    <div class="game-layout">
      <!-- Sección del Problema -->
      <div class="problem-section">
        <div id="sum-container"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      </div>

      <!-- Teclado Virtual Táctil -->
      <div class="keypad">
        <button class="key-btn" onclick="pressKey(1)">1</button>
        <button class="key-btn" onclick="pressKey(2)">2</button>
        <button class="key-btn" onclick="pressKey(3)">3</button>
        <button class="key-btn" onclick="pressKey(4)">4</button>
        <button class="key-btn" onclick="pressKey(5)">5</button>
        <button class="key-btn" onclick="pressKey(6)">6</button>
        <button class="key-btn" onclick="pressKey(7)">7</button>
        <button class="key-btn" onclick="pressKey(8)">8</button>
        <button class="key-btn" onclick="pressKey(9)">9</button>
        <button class="key-btn key-action" onclick="clearInput()">Borrar</button>
        <button class="key-btn" onclick="pressKey(0)">0</button>
        <button class="key-btn key-ok" onclick="checkAnswer()">OK</button>
      </div>
    </div>
  </div>

  <script>
    let currentLevel = '';
    let operands = [];
    let expectedSum = 0;
    let score = 0;
    let streak = 0;
    let isWaiting = false;
    let focusedInput = null;
    let roundManager = null;

    const levelSelector = document.getElementById('level-selector');
    const gameArea = document.getElementById('game-area');
    const sumContainer = document.getElementById('sum-container');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score');
    const streakEl = document.getElementById('streak');
    const beltBtns = document.querySelectorAll('.belt-btn');
    const headerTexts = document.querySelector('.header');
    const headerBeltName = document.getElementById('header-belt-name');

    const beltNames = {
      blanco: 'Cinturón Blanco',
      naranja: 'Cinturón Naranja',
      azul: 'Cinturón Azul',
      negro: 'Cinturón Negro'
    };

    function showLevelSelector() {
      gameArea.classList.remove('active');
      levelSelector.style.display = 'flex';
      headerTexts.style.display = 'block';
      refreshBeltStars();
    }

    function refreshBeltStars() {
      if (!window.DojoProgress) return;
      ['blanco', 'naranja', 'azul', 'negro'].forEach(bId => {
        const data = DojoProgress.getGameBelt('sumas', bId);
        const el = document.querySelector(`.belt-badge-stars[data-belt="${bId}"]`);
        if (el) {
          el.textContent = data.stars > 0 ? `🥋 ${'⭐'.repeat(data.stars)}` : '🥋';
        }
      });
    }

    beltBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentLevel = btn.dataset.level;
        headerBeltName.textContent = `🥋 ${beltNames[currentLevel] || currentLevel}`;
        levelSelector.style.display = 'none';
        headerTexts.style.display = 'none';
        gameArea.classList.add('active');

        score = 0; streak = 0;
        updateScore();
        feedbackEl.textContent = '';

        if (window.DojoRoundManager) {
          roundManager = new DojoRoundManager({
            gameId: 'sumas',
            beltId: currentLevel,
            beltName: beltNames[currentLevel],
            totalQuestions: 8,
            onRestart: () => startNewRound()
          });
          roundManager.start();
        }

        generateProblem();
      });
    });

    function startNewRound() {
      score = 0; streak = 0;
      updateScore();
      if (roundManager) roundManager.start();
      generateProblem();
    }

    // Foco e iluminación de columna
    window.setFocus = function(element) {
      if (isWaiting) return;
      if (focusedInput) focusedInput.classList.remove('focus');
      focusedInput = element;
      focusedInput.classList.add('focus');

      document.querySelectorAll('.box').forEach(b => b.classList.remove('col-highlight'));

      if (currentLevel === 'blanco' || currentLevel === 'naranja') {
        const colMatch = element.dataset.id.match(/\d+/);
        if (colMatch) {
          const colFromRight = parseInt(colMatch[0]);
          const numCols = String(expectedSum).length;
          const childIndex = numCols - colFromRight;

          const rows = document.querySelectorAll('.sum-row');
          rows.forEach(row => {
            const boxes = row.querySelectorAll('.box');
            if (boxes[childIndex]) {
              boxes[childIndex].classList.add('col-highlight');
            }
          });
        }
      }
    };

    function pressKey(num) {
      if (isWaiting || !focusedInput) return;
      if (window.DojoAudio) DojoAudio.play('tap');

      focusedInput.value = num;

      // Auto-avance a la izquierda
      if (focusedInput.classList.contains('result-input')) {
        let currentId = parseInt(focusedInput.dataset.id.replace('r', ''));
        let nextInput = document.querySelector(`[data-id="r${currentId + 1}"]`);
        if (nextInput) setFocus(nextInput);
      }
    }

    function clearInput() {
      if (isWaiting || !focusedInput) return;
      if (window.DojoAudio) DojoAudio.play('tap');
      focusedInput.value = '';
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateProblem() {
      operands = [];
      isWaiting = false;

      if (currentLevel === 'blanco') {
        let u1 = randomInt(1, 8); let u2 = randomInt(1, 9 - u1);
        let t1 = randomInt(1, 8); let t2 = randomInt(1, 9 - t1);
        operands.push(t1 * 10 + u1);
        operands.push(t2 * 10 + u2);
      }
      else if (currentLevel === 'naranja') {
        let a, b;
        do {
          a = randomInt(100, 999);
          b = randomInt(100, 999);
        } while (![1, 10, 100].some(place => Math.floor(a / place) % 10 + Math.floor(b / place) % 10 >= 10));
        operands.push(a, b);
      }
      else if (currentLevel === 'azul') {
        operands.push(randomInt(10000, 99999));
        operands.push(randomInt(10000, 99999));
      }
      else if (currentLevel === 'negro') {
        for (let i = 0; i < 4; i++) {
          operands.push(randomInt(10000, 99999));
        }
      }

      expectedSum = operands.reduce((a, b) => a + b, 0);
      renderGrid();
    }

    function renderGrid() {
      let html = '<div class="sum-wrapper">';
      const sumStr = String(expectedSum);
      const numCols = sumStr.length;

      // Fila de llevadas
      html += `<div class="sum-row carries">`;
      for (let c = numCols; c >= 1; c--) {
        if (c === 1 || currentLevel === 'blanco') {
          html += `<div class="box empty"></div>`;
        } else {
          html += `<input type="text" class="box sum-input carry-input" readonly data-id="c${c}" onclick="setFocus(this)" aria-label="Llevada columna ${c}">`;
        }
      }
      html += `</div>`;

      // Operandos
      operands.forEach((op, index) => {
        const isLast = (index === operands.length - 1);
        let rowClass = isLast ? 'sum-row last-operand' : 'sum-row';
        html += `<div class="${rowClass}">`;

        if (isLast) html += `<div class="sign">+</div>`;

        let opStr = String(op);
        let padding = numCols - opStr.length;

        for (let i = 0; i < padding; i++) html += `<div class="box empty"></div>`;
        for (let i = 0; i < opStr.length; i++) {
          html += `<div class="box digit">${opStr[i]}</div>`;
        }
        html += `</div>`;
      });

      // Fila de resultado
      html += `<div class="sum-row result-row">`;
      for (let c = numCols; c >= 1; c--) {
        html += `<input type="text" class="box sum-input result-input" readonly data-id="r${c}" onclick="setFocus(this)" aria-label="Resultado columna ${c}">`;
      }
      html += `</div></div>`;

      sumContainer.innerHTML = html;

      // Enfocar unidades
      const unitsBox = document.querySelector('[data-id="r1"]');
      if (unitsBox) setFocus(unitsBox);
    }

    function checkAnswer() {
      if (isWaiting) return;

      let userStr = '';
      const numCols = String(expectedSum).length;
      for (let c = numCols; c >= 1; c--) {
        const val = document.querySelector(`[data-id="r${c}"]`).value;
        userStr += (val === '' ? '0' : val);
      }
      const userSum = parseInt(userStr, 10);
      const isCorrect = (userSum === expectedSum);

      if (isCorrect) {
        isWaiting = true;
        score++; streak++;
        feedbackEl.textContent = '¡Súper suma correcta! 🦸‍♂️✨';
        feedbackEl.className = 'feedback correct';
        updateScore();

        if (window.DojoAudio) DojoAudio.play('correct');
        if (window.DojoFX) DojoFX.sparkle(sumContainer);

        const finished = roundManager ? roundManager.recordAnswer(true) : false;

        if (!finished) {
          setTimeout(() => {
            feedbackEl.textContent = '';
            generateProblem();
          }, 1200);
        }
      } else {
        streak = 0;
        feedbackEl.textContent = 'Revisa las cifras y llevadas, ¡tú puedes!';
        feedbackEl.className = 'feedback wrong';
        updateScore();

        if (window.DojoAudio) DojoAudio.play('wrong');

        const unitsBox = document.querySelector('[data-id="r1"]');
        if (unitsBox) setFocus(unitsBox);
      }
    }

    window.getPracticeHint = function() {
      const places = String(expectedSum).length;
      const padded = operands.map(value => String(value).padStart(places, '0'));
      let carry = 0;
      let unitsHint = '';
      for (let column = 1; column <= places; column++) {
        const digits = padded.map(value => Number(value[value.length - column]));
        const incomingCarry = carry;
        const total = digits.reduce((sum, digit) => sum + digit, incomingCarry);
        const columnName = column === 1 ? 'unidades' : column === 2 ? 'decenas' : column === 3 ? 'centenas' : `columna ${column}`;
        const carryOut = Math.floor(total / 10);
        const entered = document.querySelector(`[data-id="r${column}"]`)?.value;
        const hint = `En ${columnName}: ${digits.join(' + ')}${incomingCarry ? ` + la llevada ${incomingCarry}` : ''} = ${total}. Aquí va ${total % 10}${carryOut ? ` y llevas ${carryOut}` : ''}.`;
        if (!unitsHint) unitsHint = hint;
        if (entered !== String(total % 10)) return hint;
        carry = carryOut;
      }
      return unitsHint || 'Suma cada columna de derecha a izquierda y revisa las llevadas.';
    };

    function updateScore() {
      scoreEl.textContent = score;
      streakEl.textContent = streak;
    }

    // Soporte teclado físico
    document.addEventListener('keydown', (e) => {
      if (!gameArea.classList.contains('active') || isWaiting) return;
      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        clearInput();
      } else if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      refreshBeltStars();
    });
  </script>
</body>
</html>
